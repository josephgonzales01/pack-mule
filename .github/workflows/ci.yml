name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['21']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Show versions
        run: |
          java -version
          mvn -v

      - name: Build & unit test
        run: mvn -B -ntp -Dstyle.color=always verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/site/
          if-no-files-found: ignore

  integration-test:
    # End-to-end generation tests that compile real Mule projects.
    # Requires MuleSoft Nexus credentials, so it only runs when secrets are present.
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ vars.RUN_INTEGRATION_TESTS == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Configure MuleSoft Nexus settings
        env:
          MULE_NEXUS_USER: ${{ secrets.MULE_NEXUS_USER }}
          MULE_NEXUS_PASS: ${{ secrets.MULE_NEXUS_PASS }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>mule-ee-releases</id>
                <username>\${env.MULE_NEXUS_USER}</username>
                <password>\${env.MULE_NEXUS_PASS}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Run integration tests
        run: mvn -B -ntp verify -Pintegration-tests
